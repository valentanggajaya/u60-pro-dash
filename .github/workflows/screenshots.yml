name: Screen screenshots

# Renders the 320x480 screen with demo data, using the same RGB565 software
# renderer as the router, so layout changes can be reviewed without a device.
# Runs on design/* branches only (never builds or installs a router package)
# and pushes the PNGs back to the branch under design-screens/.
on:
  push:
    branches: ['design/**']
    paths: ['u60-screen/**', 'locales/**', '.github/workflows/screenshots.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the screen without a window backend
        run: cargo build --locked --release --manifest-path u60-screen/Cargo.toml --no-default-features

      - name: Render pages
        run: |
          bin=u60-screen/target/release/u60-screen
          out=design-screens
          rm -rf "$out" && mkdir -p "$out"
          for lang in en zh-Hans; do
            for theme in dark light; do
              for page in lock overview connect manage quick-controls signal-live wifi-repeater; do
                "$bin" --screenshot "$out/$lang-$theme-$page.png" --page "$page" --language "$lang" "--$theme" \
                  || echo "::warning::could not render $page ($lang, $theme)"
              done
            done
          done
          ls -la "$out"

      - name: Save screenshots to this branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add design-screens
          git commit -m "design: screenshots for ${GITHUB_SHA::7}" || exit 0
          git push
